<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paridade dos executores</title>
<!-- Página neutra do teste de paridade (v3.62.0): um caso por regressão medida, sem framework nem produto. Os ids seguem a
     gramática de standards/test-ids.md com a tela "p". O atributo de teste é "id" (como num app híbrido). -->
<style>
  body { margin: 0; font: 16px sans-serif; }
  section { padding: 8px; border-bottom: 1px solid #ccc; }
  .p-cache { position: absolute; left: 0; top: 0; transform: translateX(-200%); }
  .camada { position: relative; height: 40px; }
  .camada .tampa { position: absolute; inset: 0; background: rgba(0,0,0,.05); }
  #p\.lista { height: 160px; overflow-y: auto; border: 1px solid #999; }
  #p\.lista div { height: 30px; }
  #p\.faixa { width: 240px; overflow-x: auto; white-space: nowrap; border: 1px solid #999; }
  #p\.faixa span { display: inline-block; width: 120px; height: 30px; }
  #p\.opcoes { display: none; }
  #p\.opcoes.aberto { display: block; }
  #p\.longe { margin-top: 1400px; }
</style>
</head>
<body>
<section id="p">
  <h1 id="p.titulo">Paridade</h1>
  <input id="p.campo" value="texto antigo">
  <campo-livre id="p.livre"></campo-livre>
  <span id="p.lido">—</span>
</section>

<!-- v3.65.3 (garden SC-161): o rolador vive no shadow root do host e o conteúdo chega por <slot>; o campo é um componente de
     slot emulado que esconde o <input> dele de children/childNodes. O campo e o botão começam fora da área do rolador. -->
<section>
  <painel-rolo id="p.rolo"><div style="height: 300px">espaço</div><campo-escopo id="p.rolo.campo"><input value=""></campo-escopo><button id="p.rolo.botao" onclick="lido('rolo')">rolo</button></painel-rolo>
</section>

<!-- v3.65.3 (garden SC-204): faixa de pílulas com rolagem; tocar a última e depois a primeira traz a faixa de volta à borda -->
<section>
  <div id="p.pilulas" style="width: 240px; overflow-x: auto; white-space: nowrap; border: 1px solid #999"><button id="p.pilula.1" style="width: 110px" onclick="lido('pilula 1')">1</button><button style="width: 110px">2</button><button style="width: 110px">3</button><button style="width: 110px">4</button><button style="width: 110px">5</button><button style="width: 110px">6</button><button id="p.pilula.7" style="width: 110px" onclick="lido('pilula 7')">7</button></div>
</section>

<!-- v3.65.3 (garden SC-204): o 1º toque chega (pointerdown, touchend) e não vira clique no alvo — uma película o cobre por
     150 ms e fica com o clique, como a rolagem em curso no aparelho. E o botão que age no touchend e cancela o clique de
     propósito: o toque conta uma vez, sem repetir. -->
<section class="camada">
  <button id="p.engole" onclick="lido('engole ' + (++engoleN))">engole</button>
  <button id="p.cancela" style="margin-left: 120px">cancela</button>
</section>

<!-- página em cache: o mesmo id fora da tela, dentro de um escopo declarado em hiddenScopes -->
<section class="p-cache"><span id="p.repetido">em cache</span><span id="p.so-cache">só no cache</span><div id="p.item.cache">x</div></section>
<section><span id="p.repetido">visível</span></section>

<section>
  <div id="p.contents" style="display: contents"><span>conteúdo sem caixa própria</span></div>
  <button id="p.botao-livre" onclick="lido('livre')">livre</button>
  <div class="camada"><button id="p.botao-coberto" onclick="lido('coberto')">coberto</button><div class="tampa"></div></div>
  <span id="p.escondido" style="display: none">escondido</span>
  <label><input id="p.marca" type="checkbox"> marca</label>
</section>

<section>
  <div id="p.lista"></div>
</section>

<section>
  <div id="p.faixa"><span>a</span><span>b</span><span>c</span><span>d</span><button id="p.fim-da-faixa" onclick="lido('faixa')">fim</button></div>
</section>

<section>
  <select id="p.nativo"><option>Alface</option><option>Couve</option><option>Rúcula</option></select>
  <button id="p.combo" onclick="document.getElementById('p.opcoes').classList.toggle('aberto')">Escolha</button>
  <div id="p.opcoes"><button onclick="escolhe('Tomate')">Tomate</button><button onclick="escolhe('Pepino')">Pepino</button></div>
  <input id="p.nivel" type="range" min="0" max="10" step="1" value="0">
</section>

<!-- v3.65.1: o botão do alerta o fecha no toque (o elemento sai da tela antes da conferência do pointerdown) -->
<section>
  <button id="p.abre-alerta" onclick="document.getElementById('p.alerta').style.display = 'block'">alerta</button>
  <div id="p.alerta" style="display: none"><button id="p.alerta.ok" onclick="document.getElementById('p.alerta').style.display = 'none'; lido('alerta fechado')">OK</button></div>
</section>

<!-- v3.65.1: o alvo ainda desliza depois de aparecer (inércia, tela entrando): o toque espera ele parar -->
<section class="camada">
  <button id="p.desliza" onclick="desliza()">desliza</button>
  <button id="p.movel" style="position: absolute; left: 300px; top: 0; width: 40px" onclick="lido(movendo ? 'em movimento' : 'parado')">m</button>
</section>

<!-- v3.65.2: a tela muda 1,5 s depois do toque (gravação, lista que recarrega): o assert espera, sem "wait" no cenário -->
<section>
  <button id="p.atrasa" onclick="setTimeout(() => { lido('gravado'); document.getElementById('p.aviso').remove(); }, 1500)">atrasa</button>
  <span id="p.aviso">gravando</span>
</section>

<!-- v3.65.2 (garden S6-F4): o toque redesenha a lista — o nó tocado sai e entra outro com o MESMO id -->
<section id="p.redesenha"><button id="p.redesenha.opcao" onclick="redesenha()"><span>todos</span></button></section>

<section><button id="p.longe" onclick="lido('longe')">longe</button></section>

<script>
  // Web component de formulário: o valor fica na propriedade "value" do host e o <textarea> vive num shadow root aberto.
  customElements.define('campo-livre', class extends HTMLElement {
    constructor() { super(); const r = this.attachShadow({ mode: 'open' }); r.innerHTML = '<textarea rows="2">nota antiga</textarea>'; this._t = r.querySelector('textarea'); }
    get value() { return this._t.value; }
  });
  // Rolador no shadow root, conteúdo projetado por <slot> (como ion-content → .inner-scroll).
  customElements.define('painel-rolo', class extends HTMLElement {
    constructor() { super(); this.attachShadow({ mode: 'open' }).innerHTML = '<div style="height: 120px; overflow-y: auto; border: 1px solid #999"><slot></slot></div>'; }
  });
  // Slot emulado (como o Stencil "scoped"): children e childNodes só devolvem o conteúdo projetado — nenhum, aqui.
  customElements.define('campo-escopo', class extends HTMLElement {
    get children() { return document.createDocumentFragment().children; }
    get childNodes() { return document.createDocumentFragment().childNodes; }
  });
  let engoleN = 0, cancelaN = 0, peliculaUsada = false;
  document.getElementById('p.engole').addEventListener('pointerdown', (e) => {
    if (peliculaUsada) return; peliculaUsada = true;
    const r = e.currentTarget.getBoundingClientRect(), p = document.createElement('div');
    p.style.cssText = `position: fixed; left: ${r.left}px; top: ${r.top}px; width: ${r.width}px; height: ${r.height}px`;
    document.body.appendChild(p); setTimeout(() => p.remove(), 150);
  });
  document.getElementById('p.cancela').addEventListener('touchend', (e) => { e.preventDefault(); lido('cancela ' + (++cancelaN)); });
  const lista = document.getElementById('p.lista');
  for (let i = 1; i <= 40; i++) { const d = document.createElement('div'); d.id = 'p.item.' + i; d.textContent = 'item ' + i; lista.appendChild(d); }
  function lido(v) { document.getElementById('p.lido').textContent = v; }
  function redesenha() {
    const s = document.getElementById('p.redesenha'); lido('redesenhado');
    s.innerHTML = '<button id="p.redesenha.opcao" onclick="redesenha()"><span>todos ✓</span></button>';
  }
  let movendo = false;
  function desliza() {
    const m = document.getElementById('p.movel'); let x = 300; movendo = true;
    const t = setInterval(() => { x -= 2; m.style.left = x + 'px'; if (x <= 120) { clearInterval(t); movendo = false; } }, 16);
  }
  function escolhe(v) { document.getElementById('p.combo').textContent = v; document.getElementById('p.opcoes').classList.remove('aberto'); }
</script>
</body>
</html>
